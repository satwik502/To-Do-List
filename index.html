<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple To-Do List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 48px 16px;
    }

    .todo-card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 18px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .add-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .add-btn:hover {
      background: #1d4ed8;
    }

    .add-btn:active {
      transform: scale(0.97);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      transition: all 0.15s ease;
    }

    li:hover {
      background: #f1f5f9;
    }

    .task-label {
      flex: 1;
      cursor: pointer;
      user-select: none;
      font-size: 0.95rem;
      word-break: break-word;
      margin-right: 8px;
      color: #1e293b;
      transition: color 0.15s;
    }

    li.completed .task-label {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .del-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .del-btn:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    .empty-message {
      text-align: center;
      color: #94a3b8;
      font-size: 0.875rem;
      padding: 16px 0;
    }
  </style>
</head>
<body>

  <div class="todo-card">
    <h1>To-Do List</h1>
    
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." autofocus />
      <button class="add-btn" id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>
    <div id="emptyMessage" class="empty-message">No tasks yet. Add one above!</div>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const emptyMessage = document.getElementById("emptyMessage");

    function updateEmptyState() {
      if (taskList.children.length === 0) {
        emptyMessage.style.display = "block";
      } else {
        emptyMessage.style.display = "none";
      }
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      const li = document.createElement("li");

      // Task label that toggles completed state on click
      const span = document.createElement("span");
      span.className = "task-label";
      span.textContent = text;
      span.onclick = () => {
        li.classList.toggle("completed");
      };

      // Delete button
      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.innerHTML = "&times;";
      delBtn.title = "Delete task";
      delBtn.onclick = () => {
        li.remove();
        updateEmptyState();
      };

      li.appendChild(span);
      li.appendChild(delBtn);
      taskList.appendChild(li);

      taskInput.value = "";
      taskInput.focus();
      updateEmptyState();
    }

    // Add button click
    addBtn.addEventListener("click", addTask);

    // Enter key support
    taskInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        addTask();
      }
    });

    updateEmptyState();
  </script>
</body>
</html>
